apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-dashboard-frontend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: aws-dashboard-frontend

  template:
    metadata:
      labels:
        app: aws-dashboard-frontend

    spec:
      containers:
        - name: frontend
          image: aadityasharma96/multi-region-dashboard-frontend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
