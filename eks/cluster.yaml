apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: multi-region-dashboard
  region: us-east-1
  version: "1.35"
iam:
  withOIDC: true
vpc:
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
managedNodeGroups:
  - name: dashboard-node-group
    instanceType: t3.large
    minSize: 2
    desiredCapacity: 2
    maxSize: 2
    volumeSize: 30
    privateNetworking: false
    labels:
      workload: dashboard
    tags:
      project: multi-region-dashboard
